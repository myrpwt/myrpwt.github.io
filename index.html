
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LGNS专用计算器</title>
    <style>
        /* 终极暗黑高级配色与排版优化 */
        :root {
            --bg-body: #0d0d12;
            --bg-card: linear-gradient(145deg, #1a1a24, #14141d);
            --bg-input: rgba(255, 255, 255, 0.03);
            --border-input: rgba(255, 255, 255, 0.06); 
            --text-main: #ffffff;
            --text-muted: #8b8b9b;
            --accent-red: #f03e4d;
            --profit-green: #12d48a;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 10px 15px;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            padding: 5px 0 15px 0;
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(90deg, #ffffff, #a0a0b5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .card-title {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
        }
        .card-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 14px;
            background-color: var(--accent-red);
            border-radius: 4px;
            margin-right: 10px;
            box-shadow: 0 0 8px rgba(240, 62, 77, 0.5);
        }

        .params-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        input[type="number"] {
            background-color: var(--bg-input);
            border: 1px solid var(--border-input);
            color: var(--text-main);
            font-size: 16px;
            font-weight: 600;
            padding: 12px;
            border-radius: 12px;
            outline: none;
            width: 100%;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="number"]::placeholder {
            color: rgba(255,255,255,0.2);
            font-weight: normal;
        }

        input[type="number"]:focus {
            border-color: var(--accent-red);
            background-color: rgba(240, 62, 77, 0.05);
        }

        .full-width {
            grid-column: span 2;
        }

        .results-container {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
        }
        .result-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .time-label {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: var(--text-main);
            font-weight: 500;
        }

        .time-tag {
            background: rgba(255,255,255,0.05);
            padding: 6px 12px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .inline-input {
            width: 32px !important;
            height: 24px;
            padding: 0 !important;
            text-align: center;
            font-size: 14px !important;
            background-color: transparent !important;
            border: none !important;
            border-bottom: 1px solid var(--text-muted) !important;
            border-radius: 0 !important;
            margin-right: 4px;
            color: var(--accent-red) !important;
            font-weight: bold !important;
        }
        .inline-input:focus {
            border-bottom-color: var(--accent-red) !important;
            background-color: transparent !important;
        }

        .result-data {
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end; /* 保证靠右对齐 */
            font-variant-numeric: tabular-nums;
        }
        
        .result-coin {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 5px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
        }

        .result-fiat {
            font-size: 14px;
            font-weight: 600;
            color: var(--profit-green);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
        }
        
        .empty-dash {
            color: rgba(255,255,255,0.2);
            font-weight: normal;
        }

        /* 智能中文单位徽章的样式 */
        .unit-badge {
            font-size: 11px;
            font-weight: normal;
            color: #a0a0b5;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 2px 6px;
            border-radius: 6px;
            margin-left: 8px;
            letter-spacing: 0;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>质押复利计算器</h1>
    </div>

    <div class="card">
        <div class="card-title">核心参数</div>
        <div class="params-grid">
            <div class="input-group">
                <label>初始币量</label>
                <input type="number" id="initialAmount" placeholder="1000" step="any">
            </div>
            <div class="input-group">
                <label>当前币价 ($)</label>
                <input type="number" id="coinPrice" placeholder="6.50" step="any">
            </div>
            
            <div class="input-group">
                <label>APY (%)</label>
                <input type="number" id="apy" value="805.74" step="any">
            </div>
            <div class="input-group">
                <label>日收益率 (%)</label>
                <input type="number" id="dailyRate" value="0.6042" step="any">
            </div>

            <div class="input-group full-width">
                <label>美元兑换人民币汇率</label>
                <input type="number" id="exchangeRate" value="7" step="any">
            </div>
        </div>
    </div>

    <div class="card" style="flex-grow: 1; display: flex; flex-direction: column;">
        <div class="card-title">预估回报</div>
        
        <div class="results-container">
            <div class="result-row">
                <div class="time-label">
                    <div class="time-tag">
                        <input type="number" id="customDays" value="7" class="inline-input" step="any"> 天
                    </div>
                </div>
                <div class="result-data">
                    <div class="result-coin" id="dayAmount"><span class="empty-dash">--</span></div>
                    <div class="result-fiat" id="dayValue"><span class="empty-dash">--</span></div>
                </div>
            </div>

            <div class="result-row">
                <div class="time-label">
                    <div class="time-tag">
                        <input type="number" id="customMonths" value="1" class="inline-input" step="any"> 个月
                    </div>
                </div>
                <div class="result-data">
                    <div class="result-coin" id="monthAmount"><span class="empty-dash">--</span></div>
                    <div class="result-fiat" id="monthValue"><span class="empty-dash">--</span></div>
                </div>
            </div>

            <div class="result-row">
                <div class="time-label">
                    <div class="time-tag">
                        <input type="number" id="customYears" value="1" class="inline-input" step="any"> 年
                    </div>
                </div>
                <div class="result-data">
                    <div class="result-coin" id="yearAmount"><span class="empty-dash">--</span></div>
                    <div class="result-fiat" id="yearValue"><span class="empty-dash">--</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputAmount = document.getElementById('initialAmount');
        const inputPrice = document.getElementById('coinPrice');
        const inputExchange = document.getElementById('exchangeRate');
        const inputApy = document.getElementById('apy');
        const inputDaily = document.getElementById('dailyRate');
        const inputDays = document.getElementById('customDays');
        const inputMonths = document.getElementById('customMonths');
        const inputYears = document.getElementById('customYears');

        [inputAmount, inputPrice, inputExchange, inputDays, inputMonths, inputYears].forEach(el => {
            el.addEventListener('input', calculateResults);
        });

        inputApy.addEventListener('input', () => {
            let apy = parseFloat(inputApy.value) / 100;
            if (!isNaN(apy) && apy > -1) {
                let rebaseRate = Math.pow(1 + apy, 1 / 1095) - 1;
                inputDaily.value = (rebaseRate * 3 * 100).toFixed(4);
            }
            calculateResults();
        });

        inputDaily.addEventListener('input', () => {
            let daily = parseFloat(inputDaily.value) / 100;
            if (!isNaN(daily)) {
                let rebaseRate = daily / 3;
                let apy = Math.pow(1 + rebaseRate, 1095) - 1;
                inputApy.value = (apy * 100).toFixed(2);
            }
            calculateResults();
        });

        // 修改为保留 1 位小数
        function formatNumber(num) {
            return num.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
        }

        function formatMoney(num) {
            return '¥ ' + num.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
        }

        // 智能获取中文单位徽章
        function getUnitBadge(num) {
            if (num < 1000) return ''; // 小于一千不显示单位
            
            let text = '';
            if (num >= 100000000) {
                text = (num / 100000000).toFixed(2) + ' 亿';
            } else if (num >= 1000000) {
                text = (num / 1000000).toFixed(2) + ' 百万';
            } else if (num >= 100000) {
                text = (num / 100000).toFixed(2) + ' 十万';
            } else if (num >= 10000) {
                text = (num / 10000).toFixed(2) + ' 万';
            } else if (num >= 1000) {
                text = (num / 1000).toFixed(2) + ' 千';
            }
            return `<span class="unit-badge">${text}</span>`;
        }

        function calculateResults() {
            const amount = parseFloat(inputAmount.value);
            const daily = parseFloat(inputDaily.value) / 100;
            const price = parseFloat(inputPrice.value);
            const rate = parseFloat(inputExchange.value);
            const days = parseFloat(inputDays.value);
            const months = parseFloat(inputMonths.value);
            const years = parseFloat(inputYears.value);

            if (isNaN(amount) || isNaN(daily)) {
                resetDisplays();
                return;
            }

            const rebaseRate = daily / 3;

            function updateRow(daysCount, prefix) {
                const totalRebases = daysCount * 3;
                const finalAmount = amount * Math.pow(1 + rebaseRate, totalRebases);
                
                // 拼接数字和智能单位
                document.getElementById(`${prefix}Amount`).innerHTML = formatNumber(finalAmount) + getUnitBadge(finalAmount);

                if (!isNaN(price) && !isNaN(rate)) {
                    const totalRmb = finalAmount * price * rate;
                    document.getElementById(`${prefix}Value`).innerHTML = formatMoney(totalRmb) + getUnitBadge(totalRmb);
                } else {
                    document.getElementById(`${prefix}Value`).innerHTML = `<span class="empty-dash">待填币价</span>`;
                }
            }

            if(!isNaN(days)) updateRow(days, 'day');
            if(!isNaN(months)) updateRow(months * 30, 'month');
            if(!isNaN(years)) updateRow(years * 365, 'year');
        }

        function resetDisplays() {
            const prefixes = ['day', 'month', 'year'];
            const emptySpan = `<span class="empty-dash">--</span>`;
            prefixes.forEach(prefix => {
                document.getElementById(`${prefix}Amount`).innerHTML = emptySpan;
                document.getElementById(`${prefix}Value`).innerHTML = emptySpan;
            });
        }

        // 初始化
        calculateResults();
    </script>
</body>
</html>
